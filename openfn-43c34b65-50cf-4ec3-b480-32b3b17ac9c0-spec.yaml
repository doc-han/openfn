name: sync
description: null
collections: null
credentials: null
workflows:
  Event-based-workflow:
    name: Event-based workflow
    jobs:
      Transform-data:
        name: Transform data
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          // Validate and transform the data you've received...
          fn(state => {
            console.log("Do some data transformation here");
          })
          console.log("i changed this on github")

      Arcgis:
        name: Arcgis
        adaptor: '@openfn/language-arcgis@1.0.7'
        credential: null
        body: |
          // Check out the Job Writing Guide for help getting started:
          // https://docs.openfn.org/documentation/jobs/job-writing-guide

          // some changes here
    triggers:
      webhook:
        type: webhook
        webhook_reply: before_start
        enabled: true
    edges:
      webhook->Transform-data:
        source_trigger: webhook
        target_job: Transform-data
        condition_type: always
        enabled: true
      Transform-data->Arcgis:
        source_job: Transform-data
        target_job: Arcgis
        condition_type: on_job_success
        enabled: true
